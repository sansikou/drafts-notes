<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' capacitor: ionic:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: capacitor:; connect-src 'self' https://*.supabase.co wss://*.supabase.co capacitor:;" />
  <title>Drafts</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- 列表页 -->
    <section id="view-list" class="view view-list">
      <header class="top-bar">
        <div class="top-bar-left">
          <h1 class="nav-title">Drafts</h1>
        </div>
        <div class="top-bar-right">
          <button id="btn-select-mode" class="text-btn" type="button">选择</button>
          <button id="btn-new-note" class="icon-btn icon-btn-primary" type="button" aria-label="新建">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="sidebar-tabs">
        <button id="tab-all" class="sidebar-tab active" type="button">全部</button>
        <button id="tab-trash" class="sidebar-tab" type="button">回收站</button>
      </div>

      <div id="sidebar-toolbar" class="sidebar-toolbar hidden">
        <button id="btn-select-all" class="sidebar-tool-btn" type="button">全选</button>
        <button id="btn-delete-selected" class="sidebar-tool-btn sidebar-tool-danger" type="button">删除</button>
        <button id="btn-cancel-select" class="sidebar-tool-btn" type="button">取消</button>
      </div>

      <div class="search-box">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
          <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M9.5 9.5L12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input id="search-input" type="search" placeholder="搜索笔记…" autocomplete="off" enterkeyhint="search" />
      </div>

      <ul id="note-list" class="note-list"></ul>
    </section>

    <!-- 编辑页 -->
    <section id="view-editor" class="view view-editor hidden">
      <header class="top-bar">
        <div class="top-bar-left">
          <button id="btn-back" class="text-btn back-btn" type="button">‹ 列表</button>
        </div>
        <div class="top-bar-right">
          <button id="btn-pin-note" class="icon-btn" type="button" aria-label="置顶">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M8 1v14M8 1l3 3M8 1L5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button id="btn-delete-note" class="icon-btn icon-btn-danger" type="button" aria-label="删除">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M3 4h10M6 4V3h4v1M5 4v9a1 1 0 001 1h4a1 1 0 001-1V4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button id="btn-toggle-source" class="text-btn" type="button">MD</button>
        </div>
      </header>

      <main class="editor-area">
        <div id="note-meta" class="note-meta"></div>
        <div id="toolbar" class="toolbar">
          <button class="toolbar-btn" data-action="h1" type="button">H1</button>
          <button class="toolbar-btn" data-action="h2" type="button">H2</button>
          <button class="toolbar-btn" data-action="h3" type="button">H3</button>
          <button class="toolbar-btn" data-action="h4" type="button">H4</button>
          <span class="toolbar-divider"></span>
          <button class="toolbar-btn" data-action="bold" type="button"><strong>B</strong></button>
          <button class="toolbar-btn" data-action="italic" type="button"><em>I</em></button>
          <button class="toolbar-btn" data-action="blockquote" type="button">“</button>
          <button class="toolbar-btn" data-action="bulletList" type="button">•</button>
          <button class="toolbar-btn" data-action="taskList" type="button">☑</button>
        </div>
        <div id="editor" class="editor-content"></div>
        <textarea id="source-view" class="source-view hidden" placeholder="Markdown 源码…" spellcheck="false"></textarea>
      </main>
    </section>

    <div id="sync-indicator" class="sync-indicator" title="同步状态"></div>
  </div>
  <script src="renderer.bundle.js"></script>
</body>
</html>

name: build-ios-ipa

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-ios-ipa.yml'

jobs:
  ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and sync Capacitor iOS
        run: |
          npm ci
          npm run sync

      - name: Install CocoaPods deps
        run: |
          cd ios/App
          pod install

      - name: Archive without signing
        run: |
          mkdir -p build
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Drafts.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Pack unsigned IPA
        run: |
          APP=$(find build/Drafts.xcarchive/Products/Applications -name '*.app' | head -n 1)
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qr Drafts-ios-unsigned.ipa Payload)
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp build/Drafts-ios-unsigned.ipa "$GITHUB_WORKSPACE/release/"

      - uses: actions/upload-artifact@v4
        with:
          name: Drafts-ios-unsigned
          path: release/Drafts-ios-unsigned.ipa

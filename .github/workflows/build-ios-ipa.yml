name: Build iOS IPA (unsigned for 全能签)

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-ios-ipa.yml'

jobs:
  ipa:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install & sync Capacitor iOS
        run: |
          npm install
          npm run sync

      - name: Archive without signing
        run: |
          mkdir -p build
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Drafts.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Pack unsigned IPA
        run: |
          APP=$(find build/Drafts.xcarchive/Products/Applications -name '*.app' | head -n 1)
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -r Drafts-ios-unsigned.ipa Payload)
          mkdir -p ../release
          cp build/Drafts-ios-unsigned.ipa ../release/

      - uses: actions/upload-artifact@v4
        with:
          name: Drafts-ios-unsigned
          path: release/Drafts-ios-unsigned.ipa
